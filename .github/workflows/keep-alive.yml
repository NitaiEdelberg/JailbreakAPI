name: Keep backend awake

# Render's free tier sleeps a service after ~15 min of inactivity; the next
# visitor then waits ~50s for a cold start. This cron pings /ping so the first
# /detect call of the day is instant. The page itself also pings /ping on load
# (Frontend/script.js), so a visitor arriving outside this window overlaps the
# boot with their reading rather than with their click.
#
# ── THE BUDGET IS ACCOUNT-WIDE, NOT PER SERVICE ──────────────────────────────
# Render gives 750 free instance-hours a month across EVERY free service in the
# workspace, and when they run out it suspends ALL of them until the 1st. Three
# repos each carried a keep-alive whose comment reasoned about that 750h as if it
# were the only service. Added up:
#
#     amtza-api           18h/day    540h
#     nitaiswebsite       13h/day    390h
#     jailbreak-backend   13h/day    390h
#                                   ------
#                                   1320h  against a 750h budget (1.8x over)
#
# Nothing broke only because GitHub was silently dropping most of the runs (the
# observed interval was ~2h, not 10 min). Making the cron reliable without also
# fixing this would have suspended the whole portfolio around day 17 of a month.
#
# Current allocation, ~540h total, leaving ~210h for organic traffic:
#     amtza-api           10h/day    300h   (worst cold start: minutes, not ~50s)
#     nitaiswebsite        4h/day    120h
#     jailbreak-backend    4h/day    120h   <- this file
#
# GitHub's cron is best-effort and drops runs under load, worst at the top of the
# hour — hence the offset minute rather than a plain */10.
#
on:
  schedule:
    - cron: '9-59/10 7-10 * * *'   # every 10 min, 07:00-10:59 UTC = 10:00-14:00 Israel
  workflow_dispatch:               # manual "wake it now" run

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the Render backend
        run: |
          code=$(curl -sS -m 180 -o /dev/null -w "%{http_code}" https://jailbreak-api-backend.onrender.com/ping || echo "000")
          echo "Backend responded with HTTP $code"
          if [ "$code" = "000" ]; then
            echo "No response within 180s (cold start in progress or down)."
          fi
