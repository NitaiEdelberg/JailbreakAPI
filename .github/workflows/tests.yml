# Runs on every push and pull request. No API keys needed: every scanner here is
# local (regex rules, the indirect-injection rules and the pickled ML model), so
# a red build always means the detector itself got worse.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Backend/requirements*.txt
      - name: Install
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Unit and API tests
        run: python -m pytest -q --tb=short

      # Fails the build if detection of instructions hidden in documents drops
      # below 90%, or if a single clean real-world job description gets flagged.
      - name: Indirect-injection gate
        run: python src/eval/evaluate_indirect.py --json /tmp/indirect.json

      # Ratchet: fails if any disguise family (encodings, languages, framings)
      # catches less, or false-alarms more, than the committed baseline.
      - name: Red-team benchmark
        run: python src/eval/redteam.py

      - name: Publish the numbers to the job summary
        if: always()
        run: |
          if [ -f /tmp/indirect.json ]; then
            python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json
          d = json.load(open("/tmp/indirect.json"))
          print("### Indirect prompt injection")
          print(f"- standalone recall: **{d['standalone']['recall']}** on {d['standalone']['attacks']} attacks")
          print(f"- embedded in real documents: **{d['embedded']['recall']}** on {d['embedded']['cases']} cases")
          print(f"- clean documents flagged: **{d['clean_documents']['false_positives']} / {d['clean_documents']['documents']}**")
          print(f"- hard-negative false-positive rate: **{d['standalone']['false_positive_rate']}**")
          EOF
          fi

  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Backend/requirements*.txt
      # The SDK tests run against the real API in-process, so they need the
      # backend's dependencies too, plus the frameworks the guards plug into.
      - name: Install
        run: pip install -r Backend/requirements.txt -r Backend/requirements-dev.txt -e "sdk[test]" "langchain-core>=1.2.22"
      - name: SDK tests
        run: python -m pytest -q sdk/tests
